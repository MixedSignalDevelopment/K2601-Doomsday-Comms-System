; ============================================================================
;  Doomsday Comms System (D.C.S.) — SKU OS2601
;  Target: Ebyte E73-2G4M08S1C (Nordic nRF52840) + Ai-Thinker Ra-01SH (SX1262)
;  Core:   Adafruit nRF52 Arduino core
;
;  Firmware apps, selected by build environment:
;    env:bringup    src/bringup/    per-peripheral tester (menu of tests)
;    env:messenger  src/messenger/  point-to-point messenger (animations)
;    env:plain      src/plain/      plain messenger (everyday msgs, no animations)
;
;  Build/flash a specific one:
;    pio run -e bringup  -t upload
;    pio run -e messenger -t upload
;  Or just use the PlatformIO env switcher in the VS Code status bar.
;  `default_envs` below is what plain "Build/Upload" uses.
; ============================================================================

[platformio]
default_envs = bringup

; ---- shared config inherited by every env ---------------------------------
[env]
platform  = nordicnrf52
board     = dcs_nrf52840               ; boards/dcs_nrf52840.json
framework = arduino

board_build.variants_dir = variants
board_build.variant      = dcs

build_flags =
    -DCFG_DEBUG=0
    -DUSE_LFRC                         ; internal 32k RC osc (module has no external 32k crystal)
    -I"${platformio.packages_dir}/framework-arduinoadafruitnrf52/cores/nRF5/sysview/SEGGER"
    -I"${platformio.packages_dir}/framework-arduinoadafruitnrf52/cores/nRF5/sysview/Config"

; --- program + debug over SWD with an ST-Link V2 (plain swd, not hla_swd) ----
upload_protocol = custom
upload_command  = "${platformio.packages_dir}/tool-openocd/bin/openocd" -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/nrf52.cfg -c "program {$SOURCE} verify reset; shutdown"

debug_tool   = custom
debug_server =
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -s
    ${platformio.packages_dir}/tool-openocd/openocd/scripts
    -f
    interface/stlink.cfg
    -c
    transport select swd
    -f
    target/nrf52.cfg

lib_deps =
    olikraus/U8g2 @ ^2.35.30            ; ST7565 128x64 LCD
    adafruit/Adafruit DRV2605 Library @ ^1.2.4   ; LRA haptics
    jgromes/RadioLib @ ^7.1.0           ; SX1262 radio

; The console is RTT over SWD (see openocd_rtt.cfg + the RTT VS Code tasks).

; ============================================================================
;  App environments — each compiles only its own src/ subfolder
; ============================================================================
[env:bringup]
build_src_filter = +<bringup/>

[env:messenger]
build_src_filter = +<messenger/>

[env:plain]
build_src_filter = +<plain/>
