# ===========================================================================
#  OpenOCD config: flash-less RTT console over ST-Link V2 (SWD).
#
#  Run this AFTER `pio run -t upload` has programmed the board. It attaches to
#  the running firmware, finds the "SEGGER RTT" control block in RAM, and
#  exposes a bidirectional console on TCP port 9090.
#
#  Connect a terminal to it, e.g.:
#     pio device monitor --port socket://localhost:9090
#  (or use the "RTT console" VS Code task, which does exactly that).
# ===========================================================================

source [find interface/stlink.cfg]
transport select swd
source [find target/nrf52.cfg]

# ST-Link V2 SWD clock; drop to 500 if the tag-connect lead is long/noisy.
adapter speed 1000

init
reset run

# Give the firmware time to boot and call SEGGER_RTT_Init before we search
# (the control block lives in .bss and gets its tag only once code runs).
sleep 1500

# Scan all 256 KB of RAM for the control block tagged "SEGGER RTT".
rtt setup 0x20000000 0x40000 "SEGGER RTT"
rtt start

# Bidirectional console for RTT channel 0 on localhost:9090.
rtt server start 9090 0

echo "RTT server up on localhost:9090 — connect a terminal to see the menu."
