# ===========================================================================
#  ONE-TIME: mass-erase and flash the s140 SoftDevice (+ MBR) over ST-Link SWD.
#
#  Why: the app is linked at 0x26000 for the s140 memory layout and cannot boot
#  without the SoftDevice's MBR at 0x0. We do NOT use the Adafruit UF2/DFU
#  bootloader (it refuses to chain-load a raw-flashed app), so this image is
#  MBR + SoftDevice only. With no UICR bootloader pointer set, the MBR boots
#  SoftDevice -> app directly.
#
#  Run this once (VS Code task "Flash SoftDevice (one-time)"). After it, normal
#  `pio run -t upload` re-flashes just the app at 0x26000 and it boots.
#
#  NOTE: mass-erase wipes everything, so re-run `pio run -t upload` afterwards.
#
#  UICR.PSELRESET: mass-erase leaves it 0xFFFFFFFF (reset function disconnected),
#  and we don't flash the Adafruit bootloader that would normally set it, so the
#  P0.18 hardware reset button does nothing until we program it here. Route the
#  reset function to P0.18: value 0x12 = pin 18, CONNECT bit (b31) = 0 (connected).
#  UICR is freshly erased so writing only clears bits (no extra erase needed); it
#  is sampled only at reset, so the final `reset run` latches it.
# ===========================================================================

source [find interface/stlink.cfg]
transport select swd
source [find target/nrf52.cfg]
adapter speed 1000

init
reset halt
nrf5 mass_erase
program {softdevice/s140_6.1.1_mbr.hex} verify
flash fillw 0x10001200 0x00000012 1
flash fillw 0x10001204 0x00000012 1
reset run
shutdown
